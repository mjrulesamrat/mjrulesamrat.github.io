<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Parquet file layout (placeholder)</title>
  <rect width="720" height="400" fill="#f3f1ee"/>
  <rect x="1" y="1" width="718" height="398" fill="none" stroke="#c9c4bd" stroke-dasharray="6 6"/>

  <g font-size="13" fill="#3a3a3a">
    <rect x="200" y="30" width="320" height="30" rx="4" fill="#bc412b"/>
    <text x="360" y="50" text-anchor="middle" fill="#fff" font-weight="600">PAR1 · magic number</text>

    <rect x="200" y="72" width="320" height="104" rx="4" fill="#fff" stroke="#c9c4bd"/>
    <text x="216" y="92" font-weight="600">Row group 1</text>
    <rect x="216" y="102" width="92" height="60" rx="3" fill="#e9e4dd"/>
    <rect x="314" y="102" width="92" height="60" rx="3" fill="#e9e4dd"/>
    <rect x="412" y="102" width="92" height="60" rx="3" fill="#e9e4dd"/>
    <text x="262" y="137" text-anchor="middle">country</text>
    <text x="360" y="137" text-anchor="middle">revenue</text>
    <text x="458" y="137" text-anchor="middle">event_date</text>

    <rect x="200" y="188" width="320" height="104" rx="4" fill="#fff" stroke="#c9c4bd"/>
    <text x="216" y="208" font-weight="600">Row group 2</text>
    <rect x="216" y="218" width="92" height="60" rx="3" fill="#e9e4dd"/>
    <rect x="314" y="218" width="92" height="60" rx="3" fill="#e9e4dd"/>
    <rect x="412" y="218" width="92" height="60" rx="3" fill="#e9e4dd"/>
    <text x="262" y="253" text-anchor="middle">country</text>
    <text x="360" y="253" text-anchor="middle">revenue</text>
    <text x="458" y="253" text-anchor="middle">event_date</text>

    <rect x="200" y="304" width="320" height="30" rx="4" fill="#2d4e5e"/>
    <text x="360" y="324" text-anchor="middle" fill="#fff" font-weight="600">Footer · schema + column stats</text>

    <rect x="200" y="346" width="320" height="30" rx="4" fill="#bc412b"/>
    <text x="360" y="366" text-anchor="middle" fill="#fff" font-weight="600">PAR1 · magic number</text>

    <text x="540" y="137" fill="#6b6b6b">← column chunks</text>
    <text x="540" y="324" fill="#6b6b6b">← read first</text>
  </g>

  <text x="24" y="384" font-size="11" fill="#9a958e">PLACEHOLDER IMAGE</text>
</svg>

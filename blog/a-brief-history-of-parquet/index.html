<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blog | Jay Modi</title>
  <link rel="icon" href="/favicon.ico" />
  <link href="/media/blog.css" type="text/css" rel="stylesheet" />
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/blog/">Jay Modi</a>
      <nav><a href="/">Profile</a><a href="/blog/">Blog</a></nav>
    </div>
  </header>

  <main class="wrap">
    <article class="post" id="post">
      <header class="post-header">
        <h1 class="post-title" id="title"></h1>
        <p class="post-subtitle" id="subtitle"></p>
        <div class="byline">
          <span class="avatar" id="avatar" aria-hidden="true"></span>
          <div>
            <div class="byline-author" id="author"></div>
            <div class="meta" id="meta"></div>
          </div>
        </div>
      </header>
      <div class="post-body" id="body"></div>
      <footer class="post-footer"><a href="/blog/">&larr; All posts</a></footer>
    </article>
  </main>

  <footer class="site-footer">
    <div class="wrap">&copy; Jay Modi &middot; <a href="https://github.com/mjrulesamrat">GitHub</a> &middot; <a href="https://linkedin.com/in/mjrulesamrat">LinkedIn</a></div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="/media/blog-post.js"></script>
</body>
</html>
